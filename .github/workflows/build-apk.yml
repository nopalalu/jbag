name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter create . --org com.nopal --project-name jbag

      - name: Build APK
        run: |
          set +e
          flutter build apk --release > /tmp/build.log 2>&1
          code=$?
          echo "BUILD_EXIT_CODE=$code"
          if [ "$code" -ne 0 ]; then
            echo "### 60 baris terakhir build.log:"
            tail -60 /tmp/build.log
            body=$(tail -60 /tmp/build.log)
            body="${body//'%'/'%25'}"
            body="${body//$'\n'/'%0A'}"
            body="${body//$'\r'/'%0D'}"
            echo "::error::BUILD FAILED (exit $code). Log tail:%0A$body"
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        with:
          name: jbag-apk
          path: build/app/outputs/flutter-apk/app-release.apk
